name: Release

# Merge to main -> GitHub Release (connector binaries + install.sh) -> wrangler deploy.
# Kept lean for "merge -> live in < 5 min": no e2e/screenshots here; ci.yml ran them on the PR.
#
# One-time setup:
#   - Repo secrets (Settings -> Secrets and variables -> Actions):
#       CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permissions
#       CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
#     Without them the deploy job prints a notice and skips (the release still happens).
#   - Server secrets live in Cloudflare, not GitHub. Set once from apps/server:
#       bunx wrangler secret put CONNECTOR_PASSWORD
#     (optional: VIEWER_KEY, ANTHROPIC_API_KEY, AI_GATEWAY_API_KEY). `wrangler deploy` keeps them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false # never cancel a half-finished release/deploy

env:
  BUN_VERSION: "1.4.4"
  VERSION: 0.1.${{ github.run_number }}

jobs:
  release:
    name: Build connector + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Build connector binaries (${{ env.VERSION }})
        working-directory: apps/connector
        env:
          AGENT_OFFICE_VERSION: ${{ env.VERSION }}
        run: |
          bun scripts/build.ts darwin-arm64 darwin-x64 linux-x64
          test "$(./dist/agent-office-linux-x64 version)" = "$VERSION"

      - name: Create GitHub Release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          files="apps/connector/dist/agent-office-darwin-arm64 apps/connector/dist/agent-office-darwin-x64 apps/connector/dist/agent-office-linux-x64 apps/connector/install.sh"
          if gh release view "$tag" >/dev/null 2>&1; then
            # re-run of the same workflow run: same run_number, so refresh the assets
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files \
              --target "$GITHUB_SHA" \
              --title "Agent Office $tag" \
              --generate-notes \
              --latest
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: release # order matters: binaries must exist before the server advertises the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets missing — skipping deploy (set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.ok == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        if: steps.secrets.outputs.ok == 'true'
        run: bun install --frozen-lockfile

      - name: Build web
        if: steps.secrets.outputs.ok == 'true'
        run: bun run --filter @agent-office/web build

      - name: wrangler deploy (LATEST_CONNECTOR_VERSION=${{ env.VERSION }})
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/server
        run: |
          bunx wrangler deploy \
            --var "LATEST_CONNECTOR_VERSION:$VERSION" \
            --var "SERVER_VERSION:$VERSION"
